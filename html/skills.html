<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- JavaScript -->
    <script type="module" src="../js/main.js"></script>
</head>

<body>
    <div class="sidebar-grid">
        <aside>
            <div class="card background-card">
                <div id="sidebar"></div>
            </div>
        </aside>
        <div class="content-wrapper">
            <div class="card background-card">
                <div id="header"></div>
                <main class="skills-page">
                    <div id="sidebar-mobile"></div>
                    <div class="skills-page__content">
                        <h1 class="page-header">Meine <span>Skills</span></h1>

                        <p class="page-desc">
                            Hier findest du eine Übersicht meiner technischen Fähigkeiten und Tools,
                            mit denen ich arbeite.
                        </p>

                        <section class="data-overview" aria-label="Skill Kategorien">
                            <button id="buttonWeb" class="button tab-button" type="button" data-category="web">
                                <img src="../assets/icons/icon_globe.svg" alt="">
                                Web
                            </button>
                            <button id="buttonSoftware" class="button tab-button" type="button" data-category="software">
                                <img src="../assets/icons/icon_terminal.svg" alt="">
                                Software
                            </button>
                            <button id="buttonGameDev" class="button tab-button" type="button" data-category="gamedev">
                                <img src="../assets/icons/icon_controller.svg" alt="">
                                GameDev
                            </button>
                            <button id="buttonTools" class="button tab-button" type="button" data-category="tools">
                                <img src="../assets/icons/icon_gears.svg" alt="">
                                Tools
                            </button>
                        </section>
                        <section id="skillsContainer" aria-live="polite"></section>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <div id="skillModal" class="skill-modal" hidden>
        <div class="skill-modal__backdrop" data-modal-close></div>
        <section class="skill-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="skillModalTitle">
            <button class="skill-modal__close" type="button" aria-label="Skill-Details schließen" data-modal-close>
                <span aria-hidden="true">×</span>
            </button>
            <div class="skill-modal__header">
                <div class="skill-modal__icon">
                    <img id="skillModalImage" src="" alt="">
                </div>
                <h2 id="skillModalTitle"></h2>
            </div>
            <div class="skill-modal__content">
                <h3>Beschreibung</h3>
                <p id="skillModalDescription"></p>
                <h3>Highlights</h3>
                <ul id="skillModalHighlights"></ul>
                <h3>Projekte</h3>
                <div id="skillModalProjects" class="skill-modal__projects"></div>
            </div>
        </section>
    </div>
    <script type="module" src="../js/pages/skills.js"></script>
</body>

</html>
