<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- JavaScript -->
    <script src="../js/main.js" defer></script>
</head>

<body>
    <div class="sidebar-grid">
        <aside>
            <div class="card background-card">
                <div id="sidebar"></div>
            </div>
        </aside>
        <div class="content-wrapper">
            <div class="card background-card">
                <div id="header"></div>
                <main>
                    <div id="sidebar-mobile"></div>
                    <h1 class="page-header">Meine <span style="color: var(--color-primary-light);">Skills</span></h1>

                    <p class="page-desc">
                        Hier findest du eine Übersicht meiner technischen Fähigkeiten<br>
                        und Tools, mit denen ich arbeite.
                    </p>

                    <section class="data-overview">
                        <button id="buttonWeb" class="button tab-button">
                            <img src="../assets/icons/icon_globe.svg">
                            Web
                        </button>
                        <button id="buttonSoftware" class="button tab-button">
                            <img src="../assets/icons/icon_terminal.svg">
                            Software
                        </button>
                        <button id="buttonGameDev" class="button tab-button">
                            <img src="../assets/icons/icon_controller.svg">
                            GameDev
                        </button>
                    </section>
                    <section id="skillsContainer">
                    </section>
                </main>
            </div>
        </div>
    </div>
<script type="module" src="../js/core/state.js"></script>
<script type="module" src="../js/pages/skills.js"></script>
</body>

</html>
