<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- JavaScript -->
    <script type="module" src="../js/pages/projects.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>

<body>
    <div class="sidebar-grid">
        <aside>
            <div class="card background-card">
                <div id="sidebar"></div>
            </div>
        </aside>
        <div class="content-wrapper">
            <div class="card background-card">
                <div id="header"></div>
                <main>
                    <div id="sidebar-mobile"></div>
                    <h1 class="page-header">Meine <span style="color: var(--color-primary-light);">Projekte</span></h1>

                    <p class="page-desc">
                        Hier findest du eine Übersicht meiner Projekte im privaten sowie im beruflichen Rahmen.
                    </p>

                    <section class="data-overview" aria-label="Skill Kategorien">
                            <button class="button-private-projects" class="button tab-button" type="button" data-skill-category="web">
                                <img src="../assets/icons/icon_globe.svg" alt="">
                                Private Projekte
                            </button>
                            <button class="button-professional-projects" class="button tab-button" type="button" data-skill-category="software">
                                <img src="../assets/icons/icon_terminal.svg" alt="">
                                Berufliche Projekte
                            </button>
                        </section>

                        <label for="project-filter">Filter</label>
                        <select class="project-filter">
                            <option value="web">Nur Webprojekte</option>
                            <option value="web">Nur Softwareprojekte</option>
                            <option value="web">Nur Spielprojekte</option>    
                        </select>

                    <section id="project-container" aria-live="polite"></section>
                </main>
                <div class="footer"></div>
            </div>
        </div>
    </div>
</body>

</html>
