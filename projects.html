<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projekte | Alexander Stach</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <meta
    name="description"
    content="Eine Auswahl meiner Software- und Webentwicklungsprojekte mit Technologien, Screenshots und detaillierten Beschreibungen."
    >
    <link rel="canonical" href="https://alexander-stach.dev/projects.html">
    <meta name="author" content="Alexander Stach">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Projekte | Alexander Stach">
    <meta property="og:description" content="Web- und Softwareentwicklungsprojekte von Alexander Stach.">
    <meta property="og:image" content="https://alexander-stach.dev/assets/images/preview.png">
    <meta property="og:url" content="https://alexander-stach.dev/projects.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Projekte | Alexander Stach">
    <meta name="twitter:description" content="Web- und Softwareentwicklungsprojekte von Alexander Stach.">
    <meta name="twitter:image" content="https://alexander-stach.dev/assets/images/preview.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

    <!-- JavaScript -->
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <div class="sidebar-grid">
        <aside>
            <div class="card background-card">
                <div id="sidebar"></div>
            </div>
        </aside>
        <div class="content-wrapper">
            <div class="card background-card">
                <div id="header"></div>
                <main class="projects-page">
                    <div id="sidebar-mobile"></div>
                    <h1 class="page-header">Meine <span>Projekte</span></h1>

                    <p class="page-desc">
                        Hier findest du eine Übersicht meiner Projekte im privaten sowie im beruflichen Rahmen.
                    </p>

                    <section class="data-overview" aria-label="Skill Kategorien">
                            <button class="button tab-button"  type="button" data-category="personal">
                                <img src="assets/icons/icon_globe.svg" alt="">
                                <span class="category-label category-label--long">Private Projekte</span>
                                <span class="category-label category-label--short">Privat</span>
                            </button>
                            <button class="button tab-button" type="button" data-category="professional">
                                <img src="assets/icons/icon_terminal.svg" alt="">
                                <span class="category-label category-label--long">Berufliche Projekte</span>
                                <span class="category-label category-label--short">Beruflich</span>
                            </button>
                        </section>

                    <section id="project-container" aria-live="polite"></section>
                </main>
            </div>
        </div>
    </div>
    <div id="projectModal" class="project-modal" hidden>
        <div class="project-modal__backdrop" data-project-modal-close></div>
        <section class="project-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
            <button class="project-modal__close" type="button" aria-label="Projekt-Details schließen" data-project-modal-close><span aria-hidden="true">×</span></button>
            <div class="project-modal__header"><h2 id="projectModalTitle"></h2><span id="projectModalStatus" class="project-status"></span></div>
            <div class="project-modal__carousel" aria-label="Projekt-Screenshots">
                <button class="project-modal__carousel-button project-modal__carousel-button--previous" type="button" aria-label="Vorheriger Screenshot">‹</button>
                <img id="projectModalScreenshot" class="project-modal__screenshot" src="" alt="">
                <button class="project-modal__carousel-button project-modal__carousel-button--next" type="button" aria-label="Nächster Screenshot">›</button>
            </div>
            <div class="project-modal__content">
                <section class="project-modal__section" aria-labelledby="projectModalDescriptionHeading">
                    <h3 id="projectModalDescriptionHeading">Beschreibung</h3>
                    <p id="projectModalDescription"></p>
                </section>
                <section class="project-modal__section" aria-labelledby="projectModalHighlightsHeading">
                    <h3 id="projectModalHighlightsHeading">Highlights</h3>
                    <ul id="projectModalHighlights"></ul>
                </section>
                <section class="project-modal__section" aria-labelledby="projectModalTechnologiesHeading">
                    <h3 id="projectModalTechnologiesHeading">Technologien</h3>
                    <div id="projectModalTechnologies" class="project-modal__technologies"></div>
                </section>
                <p id="projectModalPeriod" class="project-modal__period"></p>
                <div id="projectModalLinks" class="project-modal__links"></div>
            </div>
        </section>
    </div>
    <div id="skillModal" class="skill-modal" hidden>
        <div class="skill-modal__backdrop" data-modal-close></div>
        <section class="skill-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="skillModalTitle">
            <button class="skill-modal__close" type="button" aria-label="Skill-Details schließen" data-modal-close><span aria-hidden="true">×</span></button>
            <div class="skill-modal__header"><div class="skill-modal__icon"><img id="skillModalImage" src="" alt=""></div><h2 id="skillModalTitle"></h2></div>
            <div class="skill-modal__content">
                <h3>Beschreibung</h3><p id="skillModalDescription"></p>
                <h3>Highlights</h3><ul id="skillModalHighlights"></ul>
                <h3>Projekte</h3><div id="skillModalProjects" class="skill-modal__projects"></div>
            </div>
        </section>
    </div>
    <script type="module" src="js/pages/projects.js"></script>
</body>

</html>
